name: G5.1 Production Closure Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/g5-1-closure-proof.yml'
      - 'scripts/g5-1-closure-proof.py'
      - 'requests/g5-1-closure/*.json'

permissions:
  contents: write

concurrency:
  group: g5-1-production-closure-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute production closure proof
        id: closure
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/g5-1-closure-proof.py | tee /tmp/g5-1-closure-proof.log

      - name: Preserve closure evidence on dedicated state branch
        if: always()
        run: |
          set -euo pipefail
          test -s /tmp/g5-1-closure-proof.json
          git fetch origin state/g5-1-closure-proof
          rm -rf /tmp/g5-1-proof-state
          git worktree add /tmp/g5-1-proof-state origin/state/g5-1-closure-proof
          cd /tmp/g5-1-proof-state
          mkdir -p runtime
          cp /tmp/g5-1-closure-proof.json runtime/g5-1-closure-proof.json
          cp /tmp/g5-1-closure-proof.log runtime/g5-1-closure-proof.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/g5-1-closure-proof.json runtime/g5-1-closure-proof.log
          if git diff --cached --quiet; then
            echo "closure_proof_state_unchanged"
          else
            git commit -m "Record G5.1 production closure proof [skip ci]"
            git push origin HEAD:state/g5-1-closure-proof
          fi

      - name: Upload bounded closure artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-1-production-closure-proof
          path: |
            /tmp/g5-1-closure-proof.json
            /tmp/g5-1-closure-proof.log
          retention-days: 30
          if-no-files-found: error

      - name: Enforce closure result
        if: always()
        run: |
          test "${{ steps.closure.outcome }}" = "success"
