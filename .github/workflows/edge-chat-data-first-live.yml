name: EDGE Chat · Data-First Live Run

on:
  push:
    branches:
      - 'chat-edge-*'
    paths:
      - 'requests/chat-live/*.json'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^requests/chat-live/[^/]+\.json$' | head -1)"
          test -n "$FILE"
          python - "$FILE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert str(d.get('module','')).upper()=='EDGE_STOCKS',d
          assert isinstance(d.get('command'),str) and d['command'].upper().startswith('EDGE '),d
          PY
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Run current DATA-first EDGE lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.req.outputs.file }}" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          open('/tmp/invoke.json','w').write(json.dumps({'command':d['command'],'force_new':True}))
          PY

          code="$(curl --location --silent --show-error --max-time 60 -X POST             -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"             -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"             -H "Content-Type: application/json"             --data-binary @/tmp/invoke.json             "$CONSOLE_URL/api/edge-stocks/invoke"             -o /tmp/start.json -w '%{http_code}' || echo 000)"
          echo "EDGE_START_HTTP=$code"
          cat /tmp/start.json
          test "$code" = "202"

          python - <<'PY' > /tmp/run.env
          import json,shlex
          d=json.load(open('/tmp/start.json'))
          assert d.get('ok') is True,d
          assert d.get('data_first') is True,d
          assert d.get('lifecycle_id') and d.get('ticker') and d.get('next'),d
          print('EDGE_TICKER='+shlex.quote(str(d['ticker'])))
          print('EDGE_LIFECYCLE_ID='+shlex.quote(str(d['lifecycle_id'])))
          print('EDGE_STATUS_URL='+shlex.quote(str(d['next'])))
          PY
          cat /tmp/run.env >> "$GITHUB_ENV"
          set -a; source /tmp/run.env; set +a

          terminal=""
          for attempt in $(seq 1 90); do
            code="$(curl --location --silent --show-error --max-time 90               -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"               -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"               "$CONSOLE_URL$EDGE_STATUS_URL"               -o /tmp/status.json -w '%{http_code}' || echo 000)"
            state="$(python -c "import json; d=json.load(open('/tmp/status.json')); print(str(d.get('status','')))" 2>/dev/null || true)"
            stage="$(python -c "import json; d=json.load(open('/tmp/status.json')); print(str(d.get('lifecycle_stage','')))" 2>/dev/null || true)"
            echo "EDGE_PROGRESS attempt=$attempt http=$code status=$state stage=$stage"
            if [ "$state" = "COMPLETE" ]; then terminal="COMPLETE"; break; fi
            if [ "$state" = "BLOCKED" ] || [ "$code" = "409" ]; then
              echo "EDGE_BLOCKED_BEGIN"; cat /tmp/status.json; echo "EDGE_BLOCKED_END"; exit 1
            fi
            sleep 5
          done
          test "$terminal" = "COMPLETE"

          python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('/tmp/status.json'))
          assert d.get('status')=='COMPLETE',d
          rid=d.get('run_id')
          assert rid,d
          print('EDGE_RESULT_ID='+str(rid))
          PY

          curl --location --fail-with-body --silent --show-error             -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"             -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"             "$CONSOLE_URL/api/edge-stocks/report?ticker=$EDGE_TICKER"             -o /tmp/report.json
          python - <<'PY'
          import json,os
          d=json.load(open('/tmp/report.json'))
          r=d.get('report') or {}
          assert r, d
          ids={str(r.get('run_id') or ''),str(r.get('recommendation_id') or '')}
          assert os.environ['EDGE_RESULT_ID'] in ids, {'expected':os.environ['EDGE_RESULT_ID'],'ids':ids}
          print('EDGE_REPORT_VALID=TRUE')
          PY
          echo "EDGE_LIVE_REPORT_BEGIN"
          cat /tmp/report.json
          echo
          echo "EDGE_LIVE_REPORT_END"

      - name: Preserve live result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-chat-data-first-live
          path: |
            /tmp/start.json
            /tmp/status.json
            /tmp/report.json
          retention-days: 30
          if-no-files-found: ignore
