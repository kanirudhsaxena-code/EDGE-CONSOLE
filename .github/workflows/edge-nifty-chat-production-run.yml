name: EDGE NIFTY Chat Production Run

on:
  push:
    branches:
      - chat-nifty-run-20260921
    paths:
      - 'requests/nifty/*.json'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^requests/nifty/[^/]+\.json$' | head -1)"
          test -n "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Start canonical EDGE NIFTY run
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error \
            -X POST \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary "@${{ steps.req.outputs.file }}" \
            "$CONSOLE_URL/api/5dr/automated-runs" \
            -o /tmp/start.json -w '%{http_code}')"
          cat /tmp/start.json
          echo
          test "$code" = "201"
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/start.json'))
          assert d.get('ok') is True, d
          assert d.get('sandbox') is False, d
          rid=(d.get('request') or {}).get('request_id')
          assert rid, d
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('REQUEST_ID='+rid+'\n')
          print('request_id='+rid)
          PY

      - name: Drive run to completion
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/final.json
          for attempt in $(seq 1 60); do
            code="$(curl --location --silent --show-error \
              -X POST \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "Content-Type: application/json" \
              --data '{}' \
              "$CONSOLE_URL/api/5dr/run-requests/$REQUEST_ID/resume-processing" \
              -o /tmp/status.json -w '%{http_code}')"
            cp /tmp/status.json /tmp/final.json
            python - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          print('status='+str(d.get('status'))+' stage='+str(d.get('adapter_stage'))+' error='+str(d.get('error')))
          PY
            if python - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          raise SystemExit(0 if d.get('status')=='COMPLETED' else 1)
          PY
            then
              break
            fi
            if python - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          raise SystemExit(0 if d.get('status')=='FAILED' else 1)
          PY
            then
              cat /tmp/status.json
              exit 1
            fi
            sleep 8
          done
          python - <<'PY'
          import json
          d=json.load(open('/tmp/final.json'))
          assert d.get('status')=='COMPLETED', d
          print('terminal_complete=true')
          PY

      - name: Verify canonical persisted run
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail-with-body --silent --show-error \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$CONSOLE_URL/api/5dr/run-requests/$REQUEST_ID" \
            -o /tmp/run.json
          cat /tmp/run.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/run.json'))
          run=d.get('run') or {}
          assert run.get('published') is True, d
          assert run.get('run_id'), d
          assert isinstance(run.get('result'),dict), d
          print('CANONICAL_EDGE_NIFTY_RUN=PASS')
          print('run_id='+str(run.get('run_id')))
          PY

      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-nifty-chat-production-run
          path: |
            /tmp/start.json
            /tmp/final.json
            /tmp/run.json
          retention-days: 30
          if-no-files-found: warn
