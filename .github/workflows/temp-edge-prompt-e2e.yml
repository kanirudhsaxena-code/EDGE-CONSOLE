name: TEMP EDGE Prompt E2E

on:
  push:
    branches: [test/edge-prompt-e2e]

permissions:
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Invoke live prompt path
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'content-type: application/json' \
            -X POST \
            --data '{"command":"EDGE JIOFIN"}' \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/invoke' \
            -o /tmp/invoke.json
          cat /tmp/invoke.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/invoke.json'))
          assert data['ok'] is True, data
          assert data['engine']=='EDGE_STOCKS', data
          assert data['contract_version']=='EDGE_STOCKS_V1_2', data
          assert data['ticker']=='JIOFIN', data
          assert data['trading_enabled'] is False, data
          assert data['status'] in ('DISPATCHED','ALREADY_PUBLISHED_TODAY'), data
          PY


      - name: Validate live canonical report
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/report?ticker=JIOFIN' \
            -o /tmp/report.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/report.json'))
          r=data['report']
          assert r['contract_version']=='EDGE_STOCKS_V1_2', r
          assert r['ticker']=='JIOFIN', r
          assert r['run_id']=='EDGE-JIOFIN-20260918-180236-AUTO', r
          assert r['presentation']['standard_table_count']==2, r
          assert r['presentation']['table_1']=='EDGE_OUTCOME_DECISION', r
          assert r['presentation']['table_2']=='INSTITUTIONAL_DRILLDOWN', r
          assert r['decision']['primary_action'], r
          assert r['official_efficacy']['label']=='OFFICIAL', r
          assert r['provisional_checkpoint_diagnostics']['label']=='PROVISIONAL', r
          PY
