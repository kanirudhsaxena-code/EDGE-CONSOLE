name: Refresh 25 Sep Canonical Assessment Import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-25sep-assessment-import.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-normal-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch governed assessment-state import
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/5dr-assessment-state-import.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "governed_assessment_import_dispatched"
