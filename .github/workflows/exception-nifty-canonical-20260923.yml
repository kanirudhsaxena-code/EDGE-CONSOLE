name: One-time 23 Sep NIFTY Canonical Exception Retry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exception-nifty-canonical-20260923.yml'

permissions:
  contents: read

jobs:
  nifty:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Run NIFTY 5DR exception canonical now
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          base=os.environ['CONSOLE_URL'].rstrip('/')
          def call(path, method='GET', payload=None):
              args=['curl','--location','--silent','--show-error','-H','Content-Type: application/json','-H','Accept: application/json',
                    '-H',f"CF-Access-Client-Id: {os.environ['CF_ACCESS_CLIENT_ID']}",'-H',f"CF-Access-Client-Secret: {os.environ['CF_ACCESS_CLIENT_SECRET']}",'-X',method,'-w','\\n%{http_code}']
              if payload is not None: args += ['--data-binary',json.dumps(payload,separators=(',',':'))]
              args.append(base+path)
              p=subprocess.run(args,text=True,capture_output=True)
              raw=p.stdout or ''; text,_,code_text=raw.rpartition('\n')
              try: code=int(code_text.strip())
              except: code=0
              try: body=json.loads(text) if text.strip() else {}
              except: body={'raw':text[:2000],'stderr':p.stderr[:500]}
              if code < 200 or code >= 300: raise RuntimeError(f'HTTP_{code} {body}')
              return body
          now=datetime.now(ZoneInfo('Asia/Kolkata'))
          slot='EXCEPTION_'+now.strftime('%H%M')
          created=call('/api/5dr/automated-runs','POST',{
            'force_new':True,'canonical_attempt':True,'canonical_attempt_slot':slot,
            'client_invocation_id':f'exception-canonical-20260923-nifty-{now:%H%M%S}'
          })
          request_id=((created.get('request') or {}).get('request_id'))
          if not request_id: raise SystemExit(f'CREATE_FAILED {created}')
          print(f'NIFTY_EXCEPTION_REQUEST_ID={request_id} slot={slot}')
          final=None
          for n in range(95):
              time.sleep(8)
              try: state=call(f'/api/5dr/run-requests/{request_id}/resume-processing','POST',{})
              except Exception as exc:
                  print(f'resume={n+1} transport={type(exc).__name__}:{str(exc)[:250]}'); continue
              print(f"resume={n+1} status={state.get('status')} stage={state.get('adapter_stage')} run_id={state.get('run_id')}")
              if state.get('status')=='COMPLETED': final=state; break
              if state.get('status')=='FAILED': raise SystemExit(f'NIFTY_EXCEPTION_FAILED {state}')
          if not final: raise SystemExit('NIFTY_EXCEPTION_TIMEOUT')
          out={'target_trading_date':'2026-09-23','exception_canonical':True,'actual_requested_at':now.isoformat(),'request_id':request_id,'run_id':final.get('run_id'),'slot':slot}
          open('nifty-exception-canonical.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          print('NIFTY_EXCEPTION_COMPLETE '+json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nifty-exception-canonical-20260923-retry
          path: nifty-exception-canonical.json
          if-no-files-found: ignore
          retention-days: 30
