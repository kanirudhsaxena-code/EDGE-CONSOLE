name: EDGE Stocks Pre-open Canonical Attempts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-stocks-preopen-canonical-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Governed 08:50 prep or 09:10 stock auction attempts
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          python - <<'PY'
          import json, os, time, urllib.parse, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          IST=ZoneInfo("Asia/Kolkata")
          base=os.environ["CONSOLE_URL"].rstrip("/")
          def request_json(url,method="GET",payload=None):
              args=["curl","--location","--silent","--show-error","-H","Content-Type: application/json",
                    "-H","Accept: application/json","-H",f"CF-Access-Client-Id: {os.environ['CF_ACCESS_CLIENT_ID']}",
                    "-H",f"CF-Access-Client-Secret: {os.environ['CF_ACCESS_CLIENT_SECRET']}","-X",method,"-w","\\n%{http_code}"]
              if payload is not None: args += ["--data-binary",json.dumps(payload,separators=(",",":"))]
              args.append(url)
              proc=subprocess.run(args,text=True,capture_output=True)
              raw=proc.stdout or ""; body_text,_,code_text=raw.rpartition("\n")
              try: code=int(code_text.strip())
              except Exception: code=0
              try: body=json.loads(body_text) if body_text.strip() else {}
              except Exception: body={"error":body_text[:1000] or proc.stderr[:1000]}
              return code,body

          status,targets_payload=request_json(base+"/api/edge-stocks/canonical-targets")
          if status!=200: raise SystemExit(f"CANONICAL_TARGETS_FAILED http={status} body={targets_payload}")
          targets=targets_payload.get("canonical_targets")
          if not isinstance(targets,list): raise SystemExit("CANONICAL_TARGETS_INVALID")

          now=datetime.now(IST)
          prep_start=now.replace(hour=8,minute=50,second=0,microsecond=0)
          prep_end=now.replace(hour=8,minute=59,second=59,microsecond=999999)
          auction_start=now.replace(hour=9,minute=10,second=0,microsecond=0)
          auction_cutoff=now.replace(hour=9,minute=14,second=59,microsecond=999999)

          # Preparation is intentionally non-canonical. Resolve lineages and surface
          # research freshness before auction time; never create a market-state candidate here.
          if prep_start <= now <= prep_end:
              print(json.dumps({
                  "status":"PREP_DATA_RESEARCH_LIFECYCLE_STARTED",
                  "actual":now.isoformat(),
                  "research_not_before":prep_start.isoformat(),
                  "targets":[str((t or {}).get("ticker") or "").upper() for t in targets if (t or {}).get("ticker")],
                  "requirements":{
                      "new_market_data_acquisition":True,
                      "new_deep_research":True,
                      "stock_research_coverage":"5/5",
                      "publish_canonical":False,
                  },
                  "canonical_created":False
              },sort_keys=True))
              raise SystemExit(0)

          # GitHub cron is not timing proof. Late starts fail closed as MISSING.
          if not (auction_start <= now <= auction_cutoff):
              print(json.dumps({"status":"PREOPEN_MISSING_OUTSIDE_AUCTION_WINDOW","actual":now.isoformat(),
                  "canonical_created":False},sort_keys=True))
              raise SystemExit(0)

          requested_at=now.isoformat(); slot=now.strftime("%H:%M")
          dispatched={}; skipped=[]
          for target in targets:
              ticker=str((target or {}).get("ticker") or "").strip().upper()
              if not ticker: continue
              body={"command":f"EDGE {ticker}","force_new":True,"canonical_attempt":True,
                    "canonical_attempt_slot":slot,"canonical_requested_at":requested_at,
                    "research_not_before":prep_start.isoformat()}
              code,result=request_json(base+"/api/edge-stocks/invoke","POST",body)
              if code==202 and result.get("status")=="DISPATCHED":
                  dispatched[ticker]={"after":result.get("dispatched_at"),"research_bundle_id":result.get("research_bundle_id")}
                  print(f"canonical_dispatch ticker={ticker} slot={slot} status=DISPATCHED")
              elif code==409 and result.get("code")=="EDGE_CANONICAL_RESEARCH_REFRESH_REQUIRED":
                  # Fail this lineage locally; do not block LTF or any other ticker.
                  skipped.append({"ticker":ticker,"reason":"RESEARCH_REFRESH_REQUIRED","state":"MISSING"})
                  print(f"canonical_dispatch ticker={ticker} slot={slot} status=RESEARCH_REFRESH_REQUIRED")
              else:
                  skipped.append({"ticker":ticker,"reason":result.get("code") or result.get("error") or f"HTTP_{code}","state":"MISSING"})
                  print(f"canonical_dispatch ticker={ticker} slot={slot} status=BLOCKED code={code}")

          deadline=time.monotonic()+240; completed={}
          while dispatched and time.monotonic()<deadline:
              for ticker,state in list(dispatched.items()):
                  after=state.get("after")
                  if not after:
                      skipped.append({"ticker":ticker,"reason":"MISSING_DISPATCH_TIMESTAMP","state":"MISSING"}); dispatched.pop(ticker,None); continue
                  qs=urllib.parse.urlencode({"ticker":ticker,"after":after})
                  code,result=request_json(base+"/api/edge-stocks/invoke/status?"+qs)
                  if code==200 and result.get("status")=="COMPLETE":
                      completed[ticker]=result.get("run_id"); dispatched.pop(ticker,None)
                      print(f"canonical_result ticker={ticker} status=COMPLETE run_id={result.get('run_id')}")
              if dispatched: time.sleep(8)

          for ticker in list(dispatched):
              skipped.append({"ticker":ticker,"reason":"NOT_COMPLETED_WITHIN_ATTEMPT_WINDOW","state":"MISSING"})
          print(json.dumps({"status":"EDGE_STOCKS_PREOPEN_ATTEMPT_COMPLETE","slot":slot,"requested_at":requested_at,
              "targets":len(targets),"completed":completed,"skipped":skipped,"trading_enabled":False},sort_keys=True))
          PY
