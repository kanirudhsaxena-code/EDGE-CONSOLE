name: Run 25 Sep NIFTY Exception Canonical Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/exception-nifty-run-20260925.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Create and complete exact governed NIFTY candidate
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          base=os.environ['CONSOLE_URL'].rstrip('/')
          def call(path, method='GET', payload=None):
              args=['curl','--location','--silent','--show-error','-H','Content-Type: application/json','-H','Accept: application/json','-H',f"CF-Access-Client-Id: {os.environ['CF_ACCESS_CLIENT_ID']}",'-H',f"CF-Access-Client-Secret: {os.environ['CF_ACCESS_CLIENT_SECRET']}",'-X',method,'-w','\n%{http_code}']
              if payload is not None: args += ['--data-binary',json.dumps(payload,separators=(',',':'))]
              args.append(base+path)
              p=subprocess.run(args,text=True,capture_output=True)
              raw=p.stdout or ''; text,_,code=raw.rpartition('\n')
              try: status=int(code.strip())
              except: status=0
              try: body=json.loads(text) if text.strip() else {}
              except: body={'raw':text[:2000],'stderr':p.stderr[:500]}
              return status,body
          now=datetime.now(ZoneInfo('Asia/Kolkata')); slot='USER_CANONICAL_'+now.strftime('%H%M')
          body={'force_new':True,'canonical_attempt':True,'canonical_attempt_slot':slot,'client_invocation_id':f'user-canonical-20260925-{now:%H%M%S}'}
          code,created=call('/api/5dr/automated-runs','POST',body)
          print('CREATE_HTTP='+str(code)+' '+json.dumps(created,sort_keys=True),flush=True)
          if code not in (200,201,202): raise SystemExit('NIFTY_CREATE_FAILED')
          request_id=((created.get('request') or {}).get('request_id'))
          if not request_id: raise SystemExit('NIFTY_REQUEST_ID_MISSING')
          final=None
          for n in range(90):
              time.sleep(8)
              code,state=call(f'/api/5dr/run-requests/{request_id}/resume-processing','POST',{})
              print(f"resume={n+1} http={code} status={state.get('status')} run_id={state.get('run_id')}",flush=True)
              if code==200 and state.get('status')=='COMPLETED': final=state; break
              if state.get('status')=='FAILED': raise SystemExit('NIFTY_FAILED '+json.dumps(state,sort_keys=True))
          if not final: raise SystemExit('NIFTY_TIMEOUT')
          out={'target_trading_date':'2026-09-25','actual_requested_at':now.isoformat(),'request_id':request_id,'run_id':final.get('run_id'),'slot':slot}
          open('nifty-candidate-20260925.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          print('NIFTY_25SEP_CANDIDATE_COMPLETE '+json.dumps(out,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nifty-candidate-20260925
          path: nifty-candidate-20260925.json
          if-no-files-found: ignore
          retention-days: 30
