name: 5DR Canonical Handoff State

# Manual refresh marker: 2026-09-24 NIFTY exception canonical candidate persistence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/5dr-canonical-handoff-state.yml'
  schedule:
    - cron: '0,15,30,45 3-11 * * 1-5'

permissions:
  contents: write

concurrency:
  group: 5dr-canonical-handoff-state
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export governed published 5DR handoff
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          curl --location --fail-with-body --silent --show-error \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "Accept: application/json" \
            -H "Cache-Control: no-cache" \
            "$CONSOLE_URL/api/5dr/canonical-handoff" \
            -o /tmp/5dr-canonical-handoff.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/5dr-canonical-handoff.json',encoding='utf-8'))
          assert data.get('schema_version')=='5DR_CONSOLE_HANDOFF_V1', data
          assert isinstance(data.get('runs'),list), data
          print(f"handoff_runs={len(data['runs'])}")
          PY
      - name: Publish handoff to isolated state branch
        run: |
          set -euo pipefail
          git fetch origin state/5dr-handoff
          rm -rf /tmp/5dr-handoff-state
          git worktree add /tmp/5dr-handoff-state origin/state/5dr-handoff
          cd /tmp/5dr-handoff-state
          mkdir -p runtime
          cp /tmp/5dr-canonical-handoff.json runtime/5dr-canonical-handoff.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/5dr-canonical-handoff.json
          if git diff --cached --quiet; then
            echo "handoff_state_unchanged"
            exit 0
          fi
          git commit -m "Update governed 5DR Console handoff [skip ci]"
          git push origin HEAD:state/5dr-handoff
