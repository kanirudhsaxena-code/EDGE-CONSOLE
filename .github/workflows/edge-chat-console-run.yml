name: EDGE Chat · Console-rendered Production Run

on:
  push:
    branches:
      - 'chat-edge-*'
    paths:
      - 'requests/chat-run/*.json'
      - '.github/workflows/edge-chat-console-run.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve governed chat request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^requests/chat-run/[^/]+\.json$' | head -1 || true)"
          if [ -z "$FILE" ]; then
            FILE="$(find requests/chat-run -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          test -n "$FILE"
          python - "$FILE" <<'PY'
          import json,sys
          p=sys.argv[1]
          d=json.load(open(p,encoding='utf-8'))
          module=str(d.get('module','')).upper()
          assert module in {'EDGE_NIFTY','EDGE_STOCKS'}, d
          print(module)
          PY
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Run governed EDGE request
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.req.outputs.file }}" > /tmp/request.env <<'PY'
          import json,sys,shlex
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          module=str(d['module']).upper()
          capture_only=bool(d.get('capture_only'))
          resume_existing=module=='EDGE_NIFTY' and bool(d.get('resume_existing'))
          print('CAPTURE_MODULE='+shlex.quote(module))
          print('CAPTURE_ONLY='+('true' if capture_only else 'false'))
          print('RESUME_EXISTING='+('true' if resume_existing else 'false'))
          if capture_only:
              if module=='EDGE_NIFTY':
                  rid=str(d.get('request_id') or '').strip(); assert rid,d
                  print('CAPTURE_REQUEST_ID='+shlex.quote(rid))
              else:
                  ticker=str(d.get('ticker') or '').strip().upper(); assert ticker,d
                  print('CAPTURE_TICKER='+shlex.quote(ticker))
              expected=str(d.get('expected_result_id') or '').strip()
              if expected: print('EXPECTED_RESULT_ID='+shlex.quote(expected))
          elif resume_existing:
              rid=str(d.get('request_id') or '').strip(); assert rid,d
              print('CAPTURE_REQUEST_ID='+shlex.quote(rid))
          elif module=='EDGE_NIFTY':
              assessment=d.get('assessment') or {'objective':'BOTH','risk_posture':'CONSERVATIVE','capital_priority':'CAPITAL_PROTECTION'}
              payload={'sandbox':False,'force_new':True,'client_invocation_id':d.get('client_invocation_id') or 'chat-edge-nifty','assessment':assessment}
              open('/tmp/invoke.json','w').write(json.dumps(payload))
          else:
              assert isinstance(d.get('command'),str) and d['command'].upper().startswith('EDGE '), d
              bundle=d.get('research_bundle'); assert isinstance(bundle,dict), d
              payload={'command':d['command'],'force_new':True,'research_bundle':bundle}
              open('/tmp/invoke.json','w').write(json.dumps(payload))
          PY
          cat /tmp/request.env >> "$GITHUB_ENV"
          set -a; source /tmp/request.env; set +a

          if [ "$CAPTURE_ONLY" = "true" ]; then
            echo "Capture-only mode: using existing canonical Console result."
          elif [ "$CAPTURE_MODULE" = "EDGE_NIFTY" ]; then
            if [ "$RESUME_EXISTING" != "true" ]; then
              code="$(curl --location --silent --show-error -X POST -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Content-Type: application/json" --data-binary @/tmp/invoke.json "$CONSOLE_URL/api/5dr/automated-runs" -o /tmp/start.json -w '%{http_code}')"
              cat /tmp/start.json; test "$code" = "201"
              python - <<'PY' > /tmp/nifty.env
          import json
          d=json.load(open('/tmp/start.json')); assert d.get('ok') is True and d.get('sandbox') is False,d
          rid=(d.get('request') or {}).get('request_id'); assert rid,d
          print('CAPTURE_REQUEST_ID='+rid)
          PY
              cat /tmp/nifty.env >> "$GITHUB_ENV"; source /tmp/nifty.env
            fi
            for attempt in $(seq 1 30); do
              curl --location --silent --show-error --max-time 720 -X POST -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Content-Type: application/json" --data '{}' "$CONSOLE_URL/api/5dr/run-requests/$CAPTURE_REQUEST_ID/resume-processing" -o /tmp/resume.json || true
              curl --location --fail-with-body --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$CONSOLE_URL/api/5dr/run-requests/$CAPTURE_REQUEST_ID" -o /tmp/status.json
              terminal="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/status.json')); print(str((d.get('request') or {}).get('status') or ''))
          PY
          )"
              [ "$terminal" = "COMPLETED" ] && break
              if [ "$terminal" = "FAILED" ]; then cat /tmp/status.json; exit 1; fi
              sleep 5
            done
            cp /tmp/status.json /tmp/final.json
            python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('/tmp/final.json')); req=d.get('request') or {}; run=d.get('run') or {}
          assert req.get('status')=='COMPLETED' and run.get('published') is True and run.get('run_id'),d
          print('EXPECTED_RESULT_ID='+str(run['run_id']))
          PY
          else
            invoke_code=000
            for invoke_attempt in 1 2 3; do
              invoke_code="$(curl --location --silent --show-error --connect-timeout 20 --max-time 90 \
                -X POST \
                -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
                -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
                -H "Content-Type: application/json" \
                --data-binary @/tmp/invoke.json \
                "$CONSOLE_URL/api/edge-stocks/invoke" \
                -o /tmp/start.json -w '%{http_code}' || true)"
              echo "edge_stocks_invoke_http=$invoke_code attempt=$invoke_attempt"
              cat /tmp/start.json 2>/dev/null || true
              [ "$invoke_code" = "202" ] && break
              case "$invoke_code" in 429|500|502|503|504|000) sleep $((invoke_attempt * 3));; *) break;; esac
            done
            if [ "$invoke_code" != "202" ]; then
              echo "EDGE Stocks governed invoke failed closed: HTTP $invoke_code" >&2
              exit 1
            fi
            python - <<'PY' > /tmp/stocks.env
          import json
          d=json.load(open('/tmp/start.json')); assert d.get('ok') is True,d; assert d.get('status')=='DISPATCHED',d; assert d.get('ticker'),d; assert d.get('next'),d
          print('CAPTURE_TICKER='+str(d['ticker'])); print('EDGE_STATUS_URL='+str(d['next']))
          PY
            cat /tmp/stocks.env >> "$GITHUB_ENV"; source /tmp/stocks.env
            for attempt in $(seq 1 48); do
              curl --location --fail-with-body --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$CONSOLE_URL$EDGE_STATUS_URL" -o /tmp/status.json
              state="$(python - <<'PY'
          import json
          print(str(json.load(open('/tmp/status.json')).get('status','')))
          PY
          )"
              [ "$state" = "COMPLETE" ] && break
              if [ "$state" = "FAILED" ]; then cat /tmp/status.json; exit 1; fi
              sleep 5
            done
            python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('/tmp/status.json')); assert d.get('status')=='COMPLETE',d
          rid=d.get('recommendation_id') or d.get('new_recommendation_id'); assert rid,d
          print('EXPECTED_RESULT_ID='+str(rid))
          PY
          fi

      - name: Capture live Console presentation
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          node scripts/capture-edge-console.mjs "$CAPTURE_MODULE" "${CAPTURE_REQUEST_ID:-}" "${CAPTURE_TICKER:-}" /tmp/console-presentation.txt /tmp/console-meta.json

      - name: Enforce Console-only presentation
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/console-presentation.txt
          test -s /tmp/console-meta.json
          python - <<'PY'
          import json,os
          meta=json.load(open('/tmp/console-meta.json'))
          expected=os.environ.get('EXPECTED_RESULT_ID','').strip()
          actual=str(meta.get('result_id') or '').strip()
          assert meta.get('presentation_source')=='LIVE_EDGE_CONSOLE',meta
          assert meta.get('presentation_valid') is True,meta
          if expected: assert actual==expected,(expected,actual,meta)
          print('CHAT_PRESENTATION_SOURCE=LIVE_EDGE_CONSOLE')
          print('CHAT_PRESENTATION_VALID=TRUE')
          print('CHAT_PRESENTATION_RESULT_ID='+actual)
          PY

      - name: Preserve Console presentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-console-presentation-${{ github.run_id }}
          path: |
            /tmp/start.json
            /tmp/status.json
            /tmp/final.json
            /tmp/console-presentation.txt
            /tmp/console-meta.json
          if-no-files-found: warn
          retention-days: 30
