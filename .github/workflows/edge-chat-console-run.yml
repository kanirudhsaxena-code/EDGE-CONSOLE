name: EDGE Chat · Console-rendered Production Run

on:
  push:
    branches:
      - 'chat-edge-*'
    paths:
      - 'requests/chat-run/*.json'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve governed chat request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^requests/chat-run/[^/]+\.json$' | head -1)"
          test -n "$FILE"
          python - "$FILE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          module=str(d.get('module','')).upper()
          assert module in {'EDGE_NIFTY','EDGE_STOCKS'}, d
          print(module)
          PY
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Run governed EDGE request
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.req.outputs.file }}" > /tmp/request.env <<'PY'
          import json,sys,shlex
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          module=str(d['module']).upper()
          capture_only=bool(d.get('capture_only'))
          resume_existing=module=='EDGE_NIFTY' and bool(d.get('resume_existing'))
          print('CAPTURE_MODULE='+shlex.quote(module))
          print('CAPTURE_ONLY='+('true' if capture_only else 'false'))
          print('RESUME_EXISTING='+('true' if resume_existing else 'false'))
          if capture_only:
              if module=='EDGE_NIFTY':
                  rid=str(d.get('request_id') or '').strip(); assert rid,d
                  print('CAPTURE_REQUEST_ID='+shlex.quote(rid))
              else:
                  ticker=str(d.get('ticker') or '').strip().upper(); assert ticker,d
                  print('CAPTURE_TICKER='+shlex.quote(ticker))
              expected=str(d.get('expected_result_id') or '').strip()
              if expected: print('EXPECTED_RESULT_ID='+shlex.quote(expected))
          elif resume_existing:
              rid=str(d.get('request_id') or '').strip(); assert rid,d
              print('CAPTURE_REQUEST_ID='+shlex.quote(rid))
          elif module=='EDGE_NIFTY':
              assessment=d.get('assessment') or {'objective':'BOTH','risk_posture':'CONSERVATIVE','capital_priority':'CAPITAL_PROTECTION'}
              payload={'sandbox':False,'force_new':True,'client_invocation_id':d.get('client_invocation_id') or 'chat-edge-nifty','assessment':assessment}
              if d.get('acceptance_population') == 'CLOSING_DATA_TEST':
                  # Governed closed-market acceptance: preserve exact as-of/provenance and
                  # quarantine this population from production efficacy/Learning/canonical state.
                  assert d.get('session_type') == 'CLOSING_DATA_TEST', d
                  assert isinstance(d.get('evidence_as_of'),str) and d['evidence_as_of'].strip(), d
                  provenance=d.get('evidence_provenance'); assert isinstance(provenance,list) and provenance,d
                  assert d.get('official_efficacy_eligible') is False, d
                  assert d.get('learning_eligible') is False, d
                  assert d.get('canonical_production_eligible') is False, d
                  from datetime import datetime
                  asof=datetime.fromisoformat(d['evidence_as_of'].replace('Z','+00:00'))
                  for item in provenance:
                      assert isinstance(item,dict) and str(item.get('source') or '').strip(), item
                      observed=datetime.fromisoformat(str(item.get('observed_at') or '').replace('Z','+00:00'))
                      assert observed <= asof, {'future_evidence':item,'evidence_as_of':d['evidence_as_of']}
                  payload.update({
                      'acceptance_population':'CLOSING_DATA_TEST',
                      'session_type':'CLOSING_DATA_TEST',
                      'evidence_as_of':d['evidence_as_of'],
                      'evidence_provenance':provenance,
                      'official_efficacy_eligible':False,
                      'learning_eligible':False,
                      'canonical_production_eligible':False,
                  })
              open('/tmp/invoke.json','w').write(json.dumps(payload))
          else:
              assert isinstance(d.get('command'),str) and d['command'].upper().startswith('EDGE '), d
              bundle=d.get('research_bundle'); assert isinstance(bundle,dict), d
              payload={'command':d['command'],'force_new':True,'research_bundle':bundle}
              open('/tmp/invoke.json','w').write(json.dumps(payload))
          PY
          cat /tmp/request.env >> "$GITHUB_ENV"
          set -a; source /tmp/request.env; set +a

          if [ "$CAPTURE_ONLY" = "true" ]; then
            echo "Capture-only mode: using existing canonical Console result."
          elif [ "$CAPTURE_MODULE" = "EDGE_NIFTY" ]; then
            if [ "$RESUME_EXISTING" != "true" ]; then
              code="$(curl --location --silent --show-error -X POST -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Content-Type: application/json" --data-binary @/tmp/invoke.json "$CONSOLE_URL/api/5dr/automated-runs" -o /tmp/start.json -w '%{http_code}')"
              cat /tmp/start.json; test "$code" = "201"
              python - <<'PY' > /tmp/nifty.env
          import json
          d=json.load(open('/tmp/start.json')); assert d.get('ok') is True and d.get('sandbox') is False,d
          rid=(d.get('request') or {}).get('request_id'); assert rid,d
          print('CAPTURE_REQUEST_ID='+rid)
          PY
              cat /tmp/nifty.env >> "$GITHUB_ENV"; source /tmp/nifty.env
            fi
            for attempt in $(seq 1 30); do
              curl --location --silent --show-error --max-time 720 -X POST -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Content-Type: application/json" --data '{}' "$CONSOLE_URL/api/5dr/run-requests/$CAPTURE_REQUEST_ID/resume-processing" -o /tmp/resume.json || true
              curl --location --fail-with-body --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$CONSOLE_URL/api/5dr/run-requests/$CAPTURE_REQUEST_ID" -o /tmp/status.json
              terminal="$(python -c "import json; print((json.load(open('/tmp/status.json')).get('request') or {}).get('status',''))")"
              if [ "$terminal" = "COMPLETED" ]; then break; fi
              if [ "$terminal" = "FAILED" ]; then cat /tmp/status.json; exit 1; fi
              sleep 5
            done
            cp /tmp/status.json /tmp/final.json
            python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('/tmp/final.json')); req=d.get('request') or {}; run=d.get('run') or {}
          assert req.get('status')=='COMPLETED' and run.get('published') is True and run.get('run_id'),d
          print('EXPECTED_RESULT_ID='+str(run['run_id']))
          PY
          else
            dispatched=false
            for attempt in 1 2 3; do
              code="$(curl --location --silent --show-error --max-time 60 -X POST -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Content-Type: application/json" --data-binary @/tmp/invoke.json "$CONSOLE_URL/api/edge-stocks/invoke" -o /tmp/start.json -w '%{http_code}' || echo 000)"
              echo "stocks_invoke_http=$code attempt=$attempt"
              cat /tmp/start.json 2>/dev/null || true
              if [ "$code" = "202" ]; then dispatched=true; break; fi
              case "$code" in 000|429|5??) sleep $((attempt * 3));; *) echo "Permanent EDGE Stocks invocation failure"; exit 1;; esac
            done
            test "$dispatched" = "true"
            python - <<'PY' > /tmp/stocks.env
          import json,shlex
          d=json.load(open('/tmp/start.json')); assert d.get('ok') is True,d
          assert d.get('status')=='DISPATCHED',d
          assert d.get('ticker') and d.get('next'),d
          print('CAPTURE_TICKER='+shlex.quote(str(d['ticker'])))
          print('EDGE_STATUS_URL='+shlex.quote(str(d['next'])))
          PY
            cat /tmp/stocks.env >> "$GITHUB_ENV"; source /tmp/stocks.env
            for attempt in $(seq 1 48); do
              curl --location --fail-with-body --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" "$CONSOLE_URL$EDGE_STATUS_URL" -o /tmp/status.json
              state="$(python -c "import json; print(str(json.load(open('/tmp/status.json')).get('status','')))")"
              if [ "$state" = "COMPLETE" ]; then break; fi
              if [ "$state" = "FAILED" ]; then cat /tmp/status.json; exit 1; fi
              sleep 5
            done
            python - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('/tmp/status.json')); assert d.get('status')=='COMPLETE',d
          rid=d.get('recommendation_id') or d.get('new_recommendation_id')
          assert rid, {'missing_immutable_recommendation_id':d}
          print('EXPECTED_RESULT_ID='+str(rid))
          PY
          fi

      - name: Capture live Console presentation
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          node scripts/capture-console-presentation.mjs > /tmp/chat-presentation.txt
          test -s /tmp/chat-presentation.txt
          echo "EDGE_CHAT_PRESENTATION_BEGIN"; cat /tmp/chat-presentation.txt; echo "EDGE_CHAT_PRESENTATION_END"

      - name: Fetch governed EDGE Stocks parity source
        if: env.CAPTURE_MODULE == 'EDGE_STOCKS'
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail-with-body --silent --show-error \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$CONSOLE_URL/api/edge-stocks/report?ticker=$CAPTURE_TICKER" \
            -o /tmp/chat-five-session-source.json

      - name: Enforce Console-only presentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          text=open('/tmp/chat-presentation.txt',encoding='utf-8').read(); module=os.environ['CAPTURE_MODULE']
          if module=='EDGE_NIFTY':
              required=['EDGE NIFTY','TABLE 1 · 5DR ASSESSMENT & EFFICACY','TABLE 2 · CURRENT 5DR RUN','Today’s Market View','5-day forecast','WHAT WE SAW','WHAT IT MEANS','WHY IT MATTERS NOW','What could change the view?','Future performance scorecard','Advanced details']
          else:
              required=['EDGE STOCKS','1 — EDGE MASTER ASSESSMENT','2 — ACTIVE CALLS','3 — CURRENT STOCK OUTCOME','4 — DRILL-DOWN','CANONICAL FORECAST PATH','Five governed sessions · D through D+4','EXACTLY 5']
          missing=[x for x in required if x not in text]; assert not missing, {'missing_console_sections':missing}
          if module=='EDGE_STOCKS':
              rendered_path='/tmp/chat-five-session-rendered.json'
              source_path='/tmp/chat-five-session-source.json'
              assert os.path.exists(rendered_path), {'missing_rendered_rows':rendered_path}
              assert os.path.exists(source_path), {'missing_governed_source':source_path}
              rendered=json.load(open(rendered_path,encoding='utf-8'))
              envelope=json.load(open(source_path,encoding='utf-8'))
              report=envelope.get('report') or {}
              outcome=report.get('current_stock_outcome') or {}
              source=outcome.get('forecast_sessions')
              expected=['D','D+1','D+2','D+3','D+4']
              assert outcome.get('forecast_horizon')=='D:D+4',outcome
              assert isinstance(source,list) and len(source)==5,source
              assert isinstance(rendered,list) and len(rendered)==5,rendered
              assert [x.get('session_label') for x in source]==expected,source
              assert [x.get('session_label') for x in rendered]==expected,rendered
              for i,label in enumerate(expected):
                  s=source[i]; r=rendered[i]
                  zone=s.get('expected_zone') or {}
                  assert s.get('trading_date') and s.get('direction') and zone.get('low') is not None and zone.get('high') is not None,s
                  assert r.get('trading_date')==str(s.get('trading_date')), {'label':label,'rendered':r,'source':s}
                  assert r.get('direction')==str(s.get('direction')), {'label':label,'rendered':r,'source':s}
                  assert float(r.get('zone_low'))==float(zone.get('low')), {'label':label,'rendered':r,'source':s}
                  assert float(r.get('zone_high'))==float(zone.get('high')), {'label':label,'rendered':r,'source':s}
                  assert r.get('session_label')!='D+5',r
              expected_id=os.environ.get('EXPECTED_RESULT_ID','').strip()
              if expected_id:
                  identities={str(report.get('run_id') or ''),str(report.get('recommendation_id') or '')}
                  assert expected_id in identities, {'expected_result_id':expected_id,'report_identities':sorted(identities)}
              print('CHAT_FIVE_SESSION_PARITY=TRUE')
          print('CHAT_PRESENTATION_SOURCE=LIVE_EDGE_CONSOLE'); print('CHAT_PRESENTATION_VALID=TRUE')
          PY

      - name: Preserve Console presentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-chat-console-presentation
          path: |
            /tmp/chat-presentation.txt
            /tmp/chat-five-session-rendered.json
            /tmp/chat-five-session-source.json
            /tmp/start.json
            /tmp/status.json
            /tmp/final.json
          retention-days: 30
          if-no-files-found: ignore
