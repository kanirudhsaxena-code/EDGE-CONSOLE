name: 5DR Automated Production Acceptance

on:
  workflow_run:
    workflows: ["EDGE Console Deploy"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1-5"

permissions:
  contents: read

jobs:
  acceptance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Resolve governed NSE session state
        env:
          CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          TARGET_DATE="$(TZ=Asia/Kolkata date +%F)"
          code="$(curl --location --silent --show-error             -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"             -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"             -H "Accept: application/json"             "$CONSOLE_URL/api/market-calendar/session?date=$TARGET_DATE"             -o /tmp/nse-calendar.json -w '%{http_code}')"
          cat /tmp/nse-calendar.json
          echo
          test "$code" = "200"
          python - <<'PY'
          import json
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          IST=ZoneInfo("Asia/Kolkata")
          cal=json.load(open("/tmp/nse-calendar.json"))
          state=cal.get("session_state")
          if state=="CALENDAR_COVERAGE_MISSING":
              raise SystemExit("governed NSE session authority unavailable")
          now=datetime.now(IST)
          opened=cal.get("market_open_at")
          closed=cal.get("market_close_at")
          if opened and closed:
              start=datetime.fromisoformat(str(opened).replace("Z","+00:00")).astimezone(IST)
              end=datetime.fromisoformat(str(closed).replace("Z","+00:00")).astimezone(IST)
              live=start <= now < end
          else:
              live=state=="TRADING_DAY" and time(9,15) <= now.time().replace(tzinfo=None) < time(15,30)
          out={
              **cal,
              "schema":"NSE_SESSION_STATE_DYNAMIC_V2",
              "as_of_ist":now.isoformat(),
              "market_phase":"LIVE_INTRADAY" if live else "CLOSED_SESSION",
              "expected_live_market_data":live,
          }
          json.dump(out,open("/tmp/nse-session.json","w"),indent=2,sort_keys=True)
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Start sandbox zero-upload 5DR run
        env:
          CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          code="$(curl --location --silent --show-error -X POST -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Content-Type: application/json" --data '{"sandbox":true,"assessment":{"objective":"BOTH","risk_posture":"CONSERVATIVE","capital_priority":"CAPITAL_PROTECTION"}}' "$CONSOLE_URL/api/5dr/automated-runs" -o /tmp/start.json -w '%{http_code}')"
          echo "start_http_code=$code"
          cat /tmp/start.json
          echo
          test "$code" = "201"
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/start.json'))
          req=(data.get('request') or {}).get('request_id')
          if not req:
              raise SystemExit('sandbox automated run did not return request_id: '+json.dumps(data))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('REQUEST_ID='+req+'\n')
          print('sandbox_request_started='+req)
          PY

      - name: Follow governed run to terminal state
        env:
          CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
          CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          : > /tmp/final.json
          for attempt in $(seq 1 30); do
            code="$(curl --location --silent --show-error -o /tmp/status.json -w '%{http_code}' -X POST -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H "Content-Type: application/json" --data '{}' "$CONSOLE_URL/api/5dr/run-requests/$REQUEST_ID/resume-processing")"
            cp /tmp/status.json /tmp/final.json
            python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/status.json'))
          except Exception:
              d={}
          print('status='+str(d.get('status'))+' stage='+str(d.get('adapter_stage'))+' error='+str(d.get('error')))
          PY
            if python - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          raise SystemExit(0 if d.get('status')=='COMPLETED' else 1)
          PY
            then
              break
            fi
            if python - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          session=json.load(open('/tmp/nse-session.json'))
          if d.get('adapter_stage')!='AUTOMATED_MARKET_DATA_BLOCKED':
              raise SystemExit(1)
          blockers=d.get('blockers') or []
          closed=session.get('expected_live_market_data') is False
          covered=session.get('session_state')!='CALENDAR_COVERAGE_MISSING'
          if blockers in (['CANDLE_ARRAY_MISSING'], ['INTRADAY_CANDLES_EMPTY']) and closed and covered:
              raise SystemExit(0)
          raise SystemExit(2)
          PY
            then
              echo "Closed-session transport acceptance reached governed market-data block as expected"
              break
            else
              rc=$?
              if [ "$rc" = "2" ]; then
                echo "Unexpected automated market-data block"
                cat /tmp/status.json
                exit 1
              fi
            fi
            if python - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          raise SystemExit(0 if d.get('status')=='FAILED' else 1)
          PY
            then
              echo "5DR sandbox run failed closed unexpectedly"
              cat /tmp/status.json
              exit 1
            fi
            sleep 10
          done

      - name: Assert sandbox boundary without claiming base-product acceptance
        run: |
          python - <<'PY'
          import json
          d=json.load(open('/tmp/final.json'))
          session=json.load(open('/tmp/nse-session.json'))
          if d.get('status')=='COMPLETED':
              if d.get('sandbox') is not True:
                  raise SystemExit('tester acceptance result was not marked sandbox')
              if d.get('published') is not False:
                  raise SystemExit('tester acceptance result crossed canonical publish boundary')
              if d.get('learning_eligible') is not False:
                  raise SystemExit('tester acceptance result crossed Learning Lab boundary')
              print('5DR_AUTOMATED_SANDBOX_EXECUTION=PASS')
              print('acceptance_mode=SANDBOX_LIVE_EXECUTION_ONLY')
              print('base_product_acceptance=false')
              print('immutable_production_persistence_proven=false')
              print('governed_presentation_retrieval_proven=false')
              print('request_id='+str(d.get('request_id')))
              print('run_id='+str(d.get('run_id')))
          elif (
              d.get('adapter_stage')=='AUTOMATED_MARKET_DATA_BLOCKED'
              and (d.get('blockers') or []) in (['CANDLE_ARRAY_MISSING'], ['INTRADAY_CANDLES_EMPTY'])
              and session.get('expected_live_market_data') is False
              and session.get('session_state')!='CALENDAR_COVERAGE_MISSING'
          ):
              print('5DR_AUTOMATED_TRANSPORT_ACCEPTANCE=PASS')
              print('acceptance_mode=CLOSED_SESSION_FAIL_CLOSED')
              print('session_state='+str(session.get('session_state')))
              print('market_phase='+str(session.get('market_phase')))
              print('request_id='+str(d.get('request_id')))
              print('live_engine_execution_proven=false')
              print('base_product_acceptance=false')
          else:
              raise SystemExit('acceptance did not reach a governed accepted terminal state: '+json.dumps(d))
          PY

      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5dr-automated-production-acceptance
          path: |
            /tmp/start.json
            /tmp/final.json
          retention-days: 30
          if-no-files-found: warn