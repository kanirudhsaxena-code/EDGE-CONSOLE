name: Dispatch G3 Console Learning Lab Import Now

on:
  push:
    branches:
      - ops/g3-learning-lab-import-20260923
    paths:
      - '.github/workflows/dispatch-g3-learning-lab-import-now.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production Console Learning Lab import
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run learning-lab-daily-import.yml --repo "${{ github.repository }}" --ref main
