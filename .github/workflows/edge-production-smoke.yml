name: EDGE Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '15 * * * 1-5'

permissions:
  contents: read

jobs:
  validate-edge-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Wait for deployed V1.3 surface
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H 'Cache-Control: no-cache' \
              'https://edge-console.k-anirudhsaxena.workers.dev/edge-live.js?v=${{ github.sha }}' \
              -o /tmp/edge-live.js \
              && grep -q 'EDGE_STOCKS_V1_3' /tmp/edge-live.js; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployed EDGE V1.3 renderer was not observed"
          echo "--- renderer response preview ---"
          head -c 500 /tmp/edge-live.js || true
          echo
          exit 1

      - name: Check EDGE health
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/health' \
            -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('edge_database_configured') is True, d
          PY

      - name: Validate EDGE prompt dispatch credential
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/dispatch-health' \
            -o /tmp/dispatch-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dispatch-health.json'))
          assert data['ok'] is True, data
          assert data['status']=='READY', data
          assert data['workflow']=='autonomous-publish.yml', data
          assert data['trading_enabled'] is False, data
          PY

      - name: Validate TCS Efficacy V2 report contract
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/report?ticker=TCS' \
            -o /tmp/report.json
          python - <<'PY'
          import json, math
          d=json.load(open('/tmp/report.json'))
          r=d['report']
          assert r['contract_version']=='EDGE_STOCKS_V1_3', r
          assert r['presentation_contract']=='EFFICACY_V2', r
          pres=r['presentation']
          assert pres['standard_table_count']==4, pres
          assert [pres[f'table_{i}'] for i in range(1,5)] == [
            'EDGE_MASTER_ASSESSMENT','ACTIVE_CALLS','CURRENT_STOCK_OUTCOME','DRILLDOWN'
          ], pres
          m=r['master_assessment']
          assert 'official_scorable_recommendations' in m, m
          assert 'provisional_forecast_accuracy_pct' in m, m
          probs=r['current_stock_outcome']['probabilities']
          total=sum(float(probs[k]) for k in ('bull','base','bear'))
          assert math.isclose(total,100.0,abs_tol=0.01), total
          assert r['drilldown'], r
          for row in r['drilldown']:
              if row['verification_status']=='VERIFIED':
                  text=(row.get('interpretation') or '').strip().lower()
                  assert text, row
                  assert 'no additional interpretation' not in text, row
                  assert 'retained in immutable audit record' not in text, row
          PY

      - name: Validate canonical V1.3 renderer asset
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/edge-live.js' \
            -o /tmp/edge-live.js
          grep -q 'EDGE_STOCKS_V1_3' /tmp/edge-live.js
          grep -q '1 — EDGE MASTER ASSESSMENT' /tmp/edge-live.js
          grep -q '2 — ACTIVE CALLS' /tmp/edge-live.js
          grep -q '3 — CURRENT STOCK OUTCOME' /tmp/edge-live.js
          grep -q '4 — DRILL-DOWN' /tmp/edge-live.js

      - name: Validate master efficacy separation
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/master' \
            -o /tmp/master.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/master.json'))
          assert d['labels']['official']=='OFFICIAL', d
          assert d['labels']['provisional']=='PROVISIONAL', d
          m=d['master']
          assert m is not None, d
          assert int(m['provisional_forecast_hits']) <= int(m['provisional_forecast_scorable']), m
          assert int(m['provisional_zone_hits']) <= int(m['provisional_zone_scorable']), m
          PY
