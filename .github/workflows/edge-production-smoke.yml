name: EDGE Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '15 * * * 1-5'

permissions:
  contents: read

jobs:
  validate-edge-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Wait for deployed V1.2 surface
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H 'Cache-Control: no-cache' \
              'https://edge-console.k-anirudhsaxena.workers.dev/edge-live.js?v=${{ github.sha }}' \
              -o /tmp/edge-live.js \
              && grep -q 'EDGE_STOCKS_V1_2' /tmp/edge-live.js; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployed EDGE V1.2 renderer was not observed"
          echo "--- renderer response preview ---"
          head -c 500 /tmp/edge-live.js || true
          echo
          exit 1

      - name: Check EDGE health
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/health' \
            -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('edge_database_configured') is True, d
          PY

      - name: Validate adaptive Console shell and 5DR assessment
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H 'Cache-Control: no-cache'             'https://edge-console.k-anirudhsaxena.workers.dev/'             -o /tmp/index.html
          grep -q 'data-module="5DR"' /tmp/index.html
          grep -q 'data-module="EDGE_STOCKS"' /tmp/index.html
          grep -q 'data-module="EDGE_IPO"' /tmp/index.html
          grep -q 'adaptive-light-v1b-20260918' /tmp/index.html

          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"             'https://edge-console.k-anirudhsaxena.workers.dev/api/assessment-summary?engine=5DR'             -o /tmp/assessment.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/assessment.json'))
          s=d['summary']
          assert s['engine']=='5DR', s
          assert s['forecast']['total'] >= 1, s
          assert s['forecast']['hits'] <= s['forecast']['total'], s
          assert s['recommendation']['hits'] <= s['recommendation']['total'], s
          assert 'absolute_return_pct' in s['returns'], s
          assert 'hits_return_pct' in s['returns'], s
          assert 'misses_return_pct' in s['returns'], s
          PY

          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"             'https://edge-console.k-anirudhsaxena.workers.dev/api/5dr/latest'             -o /tmp/5dr-latest.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/5dr-latest.json'))
          assert 'run' in d, d
          PY

      - name: Validate EDGE prompt dispatch credential
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/dispatch-health' \
            -o /tmp/dispatch-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dispatch-health.json'))
          assert data['ok'] is True, data
          assert data['status']=='READY', data
          assert data['workflow']=='autonomous-publish.yml', data
          assert data['trading_enabled'] is False, data
          PY

      - name: Validate LTF report contract
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/report?ticker=LTF' \
            -o /tmp/report.json
          python - <<'PY'
          import json, math
          d=json.load(open('/tmp/report.json'))
          r=d['report']
          assert r['contract_version']=='EDGE_STOCKS_V1_2', r
          pres=r['presentation']
          assert pres['standard_table_count']==2, pres
          assert pres['table_1']=='EDGE_OUTCOME_DECISION', pres
          assert pres['table_2']=='INSTITUTIONAL_DRILLDOWN', pres
          probs=r['decision']['probabilities']
          total=sum(float(probs[k]) for k in ('bull','base','bear'))
          assert math.isclose(total,100.0,abs_tol=0.01), total
          dec=r['decision']
          for key in ('des','market_trust','directional_agreement','effective_conviction','definitive_forecast','expected_price_zone','forecast_horizon','risk_override','primary_action','decision_ladder','bot','execution'):
              assert key in dec, (key, dec)
          assert r['institutional_drilldown'], r
          o=r['official_efficacy']
          p=r['provisional_checkpoint_diagnostics']
          assert o['label']=='OFFICIAL', o
          assert p['label']=='PROVISIONAL', p
          if int(o['sample_size'])==0:
              assert o['recommendation_hit_rate_pct'] is None, o
              assert o['directional_accuracy_pct'] is None, o
          assert int(p['forecast_hits']) <= int(p['forecast_scorable']), p
          assert int(p['zone_hits']) <= int(p['zone_scorable']), p
          PY


      - name: Validate canonical V1.2 renderer asset
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/edge-live.js' \
            -o /tmp/edge-live.js
          grep -q 'EDGE_STOCKS_V1_2' /tmp/edge-live.js
          grep -q 'Table 1 — EDGE Outcome / Decision' /tmp/edge-live.js
          grep -q 'Table 2 — Institutional Drill-down' /tmp/edge-live.js

      - name: Validate master efficacy separation
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/master' \
            -o /tmp/master.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/master.json'))
          assert d['labels']['official']=='OFFICIAL', d
          assert d['labels']['provisional']=='PROVISIONAL', d
          m=d['master']
          assert m is not None, d
          assert int(m['provisional_forecast_hits']) <= int(m['provisional_forecast_scorable']), m
          assert int(m['provisional_zone_hits']) <= int(m['provisional_zone_scorable']), m
          PY
