name: EDGE Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '15 * * * 1-5'

permissions:
  contents: read

jobs:
  validate-edge-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Wait for deployed V1.3 surface
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H 'Cache-Control: no-cache' \
              'https://edge-console.k-anirudhsaxena.workers.dev/edge-live.js?v=${{ github.sha }}' \
              -o /tmp/edge-live.js \
              && grep -q 'EDGE_STOCKS_V1_3' /tmp/edge-live.js; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployed EDGE V1.3 renderer was not observed"
          echo "--- renderer response preview ---"
          head -c 500 /tmp/edge-live.js || true
          echo
          exit 1

      - name: Check EDGE health
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/health' \
            -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('edge_database_configured') is True, d
          assert d.get('research_contract_version')=='EDGE_RESEARCH_BUNDLE_V1', d
          assert d.get('research_authority')=='CHATGPT', d
          assert d.get('fresh_web_research_required') is True, d
          PY

      - name: Prove ticker-only EDGE invocation fails closed
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error -o /tmp/no-research.json -w '%{http_code}' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'content-type: application/json' \
            -X POST --data '{"command":"EDGE TITAN"}' \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/invoke')"
          test "$code" = "409"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/no-research.json'))
          assert d.get('code')=='EDGE_RESEARCH_BUNDLE_REQUIRED', d
          assert d.get('contract_version')=='EDGE_RESEARCH_BUNDLE_V1', d
          PY

      - name: Prove positive research-backed TITAN production path
        run: |
          set -euo pipefail
          BASE='https://edge-console.k-anirudhsaxena.workers.dev'
          AUTH=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")

          curl --location --fail --silent --show-error "${AUTH[@]}"             "$BASE/api/edge-stocks/research-bundles/EDGE-RESEARCH-TITAN-20260920T061100Z"             -o /tmp/titan-research.json
          curl --location --fail --silent --show-error "${AUTH[@]}"             "$BASE/api/edge-stocks/invoke/status?ticker=TITAN&after=2026-09-20T06:11:30Z"             -o /tmp/titan-status.json
          curl --location --fail --silent --show-error "${AUTH[@]}"             "$BASE/api/edge-stocks/report?ticker=TITAN"             -o /tmp/titan-report.json

          python - <<'PY'
          import json, math
          b=json.load(open('/tmp/titan-research.json'))['research_bundle']
          s=json.load(open('/tmp/titan-status.json'))
          r=json.load(open('/tmp/titan-report.json'))['report']

          assert b['bundle_id']=='EDGE-RESEARCH-TITAN-20260920T061100Z', b
          assert b['ticker']=='TITAN', b
          assert b['research_authority']=='CHATGPT', b
          assert b['contract_version']=='EDGE_RESEARCH_BUNDLE_V1', b
          assert b['status']=='READY', b
          payload=b['payload']
          assert 'CHATGPT_WEB' in payload['retrieval_providers'], payload
          assert payload['research_authority']=='CHATGPT', payload

          assert s['status']=='COMPLETE', s
          assert s['ticker']=='TITAN', s
          assert s['trading_enabled'] is False, s
          assert r['run_id']==s['run_id'], (r['run_id'],s['run_id'])
          assert r['contract_version']=='EDGE_STOCKS_V1_3', r
          assert r['presentation_contract']=='EFFICACY_V2', r
          pres=r['presentation']
          assert [pres[f'table_{i}'] for i in range(1,5)] == [
            'EDGE_MASTER_ASSESSMENT','ACTIVE_CALLS','CURRENT_STOCK_OUTCOME','DRILLDOWN'
          ], pres
          probs=r['current_stock_outcome']['probabilities']
          assert math.isclose(sum(float(probs[k]) for k in ('bull','base','bear')),100.0,abs_tol=0.01), probs
          prev=r['master_assessment']['stock_assessment'].get('previous_recommendation')
          assert prev is not None, r['master_assessment']['stock_assessment']
          assert prev['recommendation_id']=='EDGE-TITAN-20260919-114358-AUTO', prev
          assert prev.get('outcome_verdict') in ('OPEN','HIT','MISS','PARTIAL','EXPIRED','CLOSED'), prev
          assert r['drilldown'], r
          for row in r['drilldown']:
              assert (row.get('interpretation') or '').strip(), row
          PY

      - name: Validate EDGE prompt dispatch credential
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/dispatch-health' \
            -o /tmp/dispatch-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dispatch-health.json'))
          assert data['ok'] is True, data
          assert data['status']=='READY', data
          assert data['workflow']=='autonomous-publish.yml', data
          assert data['trading_enabled'] is False, data
          PY

      - name: Validate TCS Efficacy V2 report contract
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/report?ticker=TCS' \
            -o /tmp/report.json
          python - <<'PY'
          import json, math
          d=json.load(open('/tmp/report.json'))
          r=d['report']
          assert r['contract_version']=='EDGE_STOCKS_V1_3', r
          assert r['presentation_contract']=='EFFICACY_V2', r
          pres=r['presentation']
          assert pres['standard_table_count']==4, pres
          assert [pres[f'table_{i}'] for i in range(1,5)] == [
            'EDGE_MASTER_ASSESSMENT','ACTIVE_CALLS','CURRENT_STOCK_OUTCOME','DRILLDOWN'
          ], pres
          m=r['master_assessment']
          assert 'official_scorable_recommendations' in m, m
          assert 'provisional_forecast_accuracy_pct' in m, m
          probs=r['current_stock_outcome']['probabilities']
          total=sum(float(probs[k]) for k in ('bull','base','bear'))
          assert math.isclose(total,100.0,abs_tol=0.01), total
          assert r['drilldown'], r
          for row in r['drilldown']:
              if row['verification_status']=='VERIFIED':
                  text=(row.get('interpretation') or '').strip().lower()
                  assert text, row
                  assert 'no additional interpretation' not in text, row
                  assert 'retained in immutable audit record' not in text, row
          PY

      - name: Validate canonical V1.3 renderer asset
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/edge-live.js' \
            -o /tmp/edge-live.js
          grep -q 'EDGE_STOCKS_V1_3' /tmp/edge-live.js
          grep -q '1 — EDGE MASTER ASSESSMENT' /tmp/edge-live.js
          grep -q '2 — ACTIVE CALLS' /tmp/edge-live.js
          grep -q '3 — CURRENT STOCK OUTCOME' /tmp/edge-live.js
          grep -q '4 — DRILL-DOWN' /tmp/edge-live.js
          grep -q 'canonical-edge-table' /tmp/edge-live.js
          grep -q 'Previous recommendation' /tmp/edge-live.js
          ! grep -q 'semantic-contract-tables' /tmp/edge-live.js
          ! grep -q 'aria-hidden="true"' /tmp/edge-live.js
          python - <<'PY'
          text=open('/tmp/edge-live.js',encoding='utf-8').read()
          positions=[text.index(x) for x in (
              '1 — EDGE MASTER ASSESSMENT',
              '2 — ACTIVE CALLS',
              '3 — CURRENT STOCK OUTCOME',
              '4 — DRILL-DOWN',
          )]
          assert positions==sorted(positions), positions
          PY

      - name: Validate master efficacy separation
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/master' \
            -o /tmp/master.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/master.json'))
          assert d['labels']['official']=='OFFICIAL', d
          assert d['labels']['provisional']=='PROVISIONAL', d
          m=d['master']
          assert m is not None, d
          assert int(m['provisional_forecast_hits']) <= int(m['provisional_forecast_scorable']), m
          assert int(m['provisional_zone_hits']) <= int(m['provisional_zone_scorable']), m
          PY
