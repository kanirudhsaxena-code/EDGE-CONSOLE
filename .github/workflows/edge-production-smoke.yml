name: EDGE Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '15 * * * 1-5'

permissions:
  contents: read

jobs:
  validate-edge-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Wait for deployed V1.3 surface
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" -H 'Cache-Control: no-cache' \
              'https://edge-console.k-anirudhsaxena.workers.dev/edge-live.js?v=${{ github.sha }}' \
              -o /tmp/edge-live.js \
              && grep -q 'EDGE_STOCKS_V1_3' /tmp/edge-live.js \
              && grep -q 'edge-user-output' /tmp/edge-live.js \
              && grep -q 'Outcome checks recorded' /tmp/edge-live.js \
              && grep -q '5-DAY DIRECTION' /tmp/edge-live.js \
              && grep -q 'EXPECTED 5-DAY RANGE' /tmp/edge-live.js \
              && grep -q 'Price, Volume, Premium & Open Interest' /tmp/edge-live.js \
              && grep -q 'WHY IT MATTERS' /tmp/edge-live.js; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployed EDGE V1.3 renderer was not observed"
          echo "--- renderer response preview ---"
          head -c 500 /tmp/edge-live.js || true
          echo
          exit 1

      - name: Verify fresh mobile UI shell
        run: |
          set -euo pipefail
          BASE='https://edge-console.k-anirudhsaxena.workers.dev'
          AUTH=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          curl --location --fail --silent --show-error -D /tmp/ui-headers.txt "${AUTH[@]}" -H 'Cache-Control: no-cache' "$BASE/?ui=edge-v2-20260920" -o /tmp/index.html
          grep -q 'edge-live.js?v=edge-ui-v17-20260921' /tmp/index.html
          grep -q 'styles.css?v=edge-ui-v17-20260921' /tmp/index.html
          grep -q 'EDGE NIFTY' /tmp/index.html
          grep -q 'Run EDGE NIFTY' /tmp/index.html
          grep -q 'app.js?v=edge-ui-v17-20260921' /tmp/index.html
          curl --location --fail --silent --show-error "${AUTH[@]}" -H 'Cache-Control: no-cache' "$BASE/app.js?v=edge-ui-v17-20260921" -o /tmp/app.js
          grep -Fq 'body:JSON.stringify({command,force_new:true})' /tmp/app.js
          grep -Fq 'force_new:true,client_invocation_id:crypto.randomUUID()' /tmp/app.js
          grep -Fq 'ACTIVE_NIFTY_REQUEST_KEY' /tmp/app.js
          grep -Fq 'fetchExactNiftyRequest' /tmp/app.js
          ! grep -Fq 'Continue EDGE NIFTY' /tmp/app.js
          grep -Fq 'Drill down — day-wise forecast, range & outcomes' /tmp/app.js
          grep -Fq 'Matured eligible' /tmp/app.js
          grep -Fq 'No evidence-supported day-specific direction/range was stored for this slot.' /tmp/app.js
          grep -Fq '5-day forecast — day-wise direction & range' /tmp/app.js
          grep -Fq 'pending-forecast-details' /tmp/app.js
          grep -Fq 'current-forecast-details' /tmp/app.js
          grep -Fq 'matured eligible' /tmp/app.js
          grep -Fq 'resolved canonical recommendations' /tmp/app.js
          grep -Fq 'one selected DAILY_CANONICAL forecast per target trading date' /tmp/app.js
          grep -Fq 'Matured · not scorable' /tmp/app.js
          grep -Fq 'matured unscorable' /tmp/app.js
          grep -Fq 'Official canonical · latest governed target' /tmp/app.js
          grep -Fq 'This operational run affects official accuracy only if it becomes the selected canonical' /tmp/app.js
          grep -qi '^cache-control:.*no-store' /tmp/ui-headers.txt
          ! grep -q 'automated-5dr-v1-20260919' /tmp/index.html

      - name: Check EDGE health
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/health' \
            -o /tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True, d
          assert d.get('edge_database_configured') is True, d
          assert d.get('research_contract_version')=='EDGE_RESEARCH_BUNDLE_V1', d
          assert d.get('research_authority')=='CHATGPT', d
          assert d.get('fresh_web_research_required') is True, d
          PY

      - name: Prove ticker-only EDGE invocation fails closed
        run: |
          set -euo pipefail
          code="$(curl --location --silent --show-error -o /tmp/no-research.json -w '%{http_code}' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'content-type: application/json' \
            -X POST --data '{"command":"EDGE NOFRESH123","force_new":true}' \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/invoke')"
          test "$code" = "409"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/no-research.json'))
          assert d.get('code')=='EDGE_RESEARCH_BUNDLE_REQUIRED', d
          assert d.get('contract_version')=='EDGE_RESEARCH_BUNDLE_V1', d
          PY

      - name: Prove non-forced API compatibility and live LTF report
        run: |
          set -euo pipefail
          BASE='https://edge-console.k-anirudhsaxena.workers.dev'
          AUTH=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")

          code="$(curl --location --silent --show-error -o /tmp/ltf-existing.json -w '%{http_code}'             "${AUTH[@]}" -H 'content-type: application/json'             -X POST --data '{"command":"EDGE LTF"}'             "$BASE/api/edge-stocks/invoke")"
          test "$code" = "200"

          curl --location --fail --silent --show-error "${AUTH[@]}"             "$BASE/api/edge-stocks/report?ticker=LTF"             -o /tmp/ltf-report.json

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          invoke=json.load(open('/tmp/ltf-existing.json'))
          report=json.load(open('/tmp/ltf-report.json'))['report']

          assert invoke.get('status')=='ALREADY_PUBLISHED_TODAY', invoke
          assert invoke.get('ticker')=='LTF', invoke
          assert invoke.get('run_id'), invoke
          assert invoke.get('run_timestamp'), invoke

          assert report['ticker']=='LTF', report
          assert report['run_id']==invoke['run_id'], (report['run_id'], invoke['run_id'])
          assert report['contract_version']=='EDGE_STOCKS_V1_3', report
          assert report['presentation_contract']=='EFFICACY_V2', report
          assert report.get('generated_at'), report
          assert 'canonical_governance' in report, report
          assert report['canonical_governance'].get('canonical_type'), report

          run_dt=datetime.fromisoformat(str(invoke['run_timestamp']).replace('Z','+00:00')).astimezone(ZoneInfo('Asia/Kolkata'))
          now=datetime.now(timezone.utc).astimezone(ZoneInfo('Asia/Kolkata'))
          assert run_dt.date()==now.date(), (run_dt, now)

          probs=report['current_stock_outcome']['probabilities']
          total=sum(float(probs[k]) for k in ('bull','base','bear'))
          assert abs(total-100.0)<=0.01, probs

          print(json.dumps({
            'ticker':'LTF',
            'run_id':invoke['run_id'],
            'run_timestamp':invoke['run_timestamp'],
            'forecast':report['current_stock_outcome']['definitive_forecast'],
            'bull':probs['bull'],
            'base':probs['base'],
            'bear':probs['bear'],
            'market_trust':report['current_stock_outcome']['market_trust'],
            'expected_price_zone':report['current_stock_outcome']['expected_price_zone'],
            'primary_action':report['current_stock_outcome']['primary_action'],
          }))
          PY

      - name: Validate EDGE prompt dispatch credential
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/dispatch-health' \
            -o /tmp/dispatch-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/dispatch-health.json'))
          assert data['ok'] is True, data
          assert data['status']=='READY', data
          assert data['workflow']=='autonomous-publish.yml', data
          assert data['trading_enabled'] is False, data
          PY

      - name: Validate TCS Efficacy V2 report contract
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/report?ticker=TCS' \
            -o /tmp/report.json
          python - <<'PY'
          import json, math
          d=json.load(open('/tmp/report.json'))
          r=d['report']
          assert r['contract_version']=='EDGE_STOCKS_V1_3', r
          assert r['presentation_contract']=='EFFICACY_V2', r
          pres=r['presentation']
          assert pres['standard_table_count']==4, pres
          assert [pres[f'table_{i}'] for i in range(1,5)] == [
            'EDGE_MASTER_ASSESSMENT','CURRENT_STOCK_OUTCOME','DRILLDOWN','ACTIVE_CALLS'
          ], pres
          m=r['master_assessment']
          assert 'official_scorable_recommendations' in m, m
          assert 'provisional_forecast_accuracy_pct' in m, m
          probs=r['current_stock_outcome']['probabilities']
          total=sum(float(probs[k]) for k in ('bull','base','bear'))
          assert math.isclose(total,100.0,abs_tol=0.01), total
          assert r['drilldown'], r
          for row in r['drilldown']:
              if row['verification_status']=='VERIFIED':
                  text=(row.get('interpretation') or '').strip().lower()
                  assert text, row
                  assert 'no additional interpretation' not in text, row
                  assert 'retained in immutable audit record' not in text, row
          PY

      - name: Validate canonical V1.3 renderer asset
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/edge-live.js' \
            -o /tmp/edge-live.js
          grep -q 'EDGE_STOCKS_V1_3' /tmp/edge-live.js
          grep -q '1 — EDGE MASTER ASSESSMENT' /tmp/edge-live.js
          grep -q '2 — CURRENT STOCK OUTCOME' /tmp/edge-live.js
          grep -q '3 — DRILL-DOWN' /tmp/edge-live.js
          grep -q '4 — ACTIVE CALLS' /tmp/edge-live.js
          grep -q 'edge-user-output' /tmp/edge-live.js
          grep -q 'Evidence confidence' /tmp/edge-live.js
          grep -q 'Outcome checks recorded' /tmp/edge-live.js
          grep -q '5-DAY DIRECTION' /tmp/edge-live.js
          grep -q 'EXPECTED 5-DAY RANGE' /tmp/edge-live.js
          grep -q 'WHY IT MATTERS' /tmp/edge-live.js
          grep -q 'Official canonical status' /tmp/edge-live.js
          grep -q 'Only selected canonical recommendations enter official efficacy' /tmp/edge-live.js
          ! grep -q '<b>Outcome:</b>' /tmp/edge-live.js
          grep -q 'Call date/time:' /tmp/edge-live.js
          grep -q 'execution-key-grid' /tmp/edge-live.js
          grep -q '<details class="change-details"><summary>What could change the view?</summary>' /tmp/edge-live.js
          ! grep -q 'semantic-contract-tables' /tmp/edge-live.js
          ! grep -q 'aria-hidden="true"' /tmp/edge-live.js
          python - <<'PY'
          text=open('/tmp/edge-live.js',encoding='utf-8').read()
          positions=[text.index(x) for x in (
              '1 — EDGE MASTER ASSESSMENT',
              '2 — CURRENT STOCK OUTCOME',
              '3 — DRILL-DOWN',
              '4 — ACTIVE CALLS',
          )]
          assert positions==sorted(positions), positions
          PY

      - name: Validate master efficacy separation
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            'https://edge-console.k-anirudhsaxena.workers.dev/api/edge-stocks/master' \
            -o /tmp/master.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/master.json'))
          assert d['labels']['official']=='OFFICIAL', d
          assert d['labels']['provisional']=='PROVISIONAL', d
          m=d['master']
          assert m is not None, d
          assert int(m['provisional_forecast_hits']) <= int(m['provisional_forecast_scorable']), m
          assert int(m['provisional_zone_hits']) <= int(m['provisional_zone_scorable']), m
          PY
