name: EDGE Console CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: python -m unittest discover -s scripts -p 'test_store_edge_research.py'



  build3-foundation-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edge_console_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d edge_console_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply Build 3.0 Foundation migrations in order
        run: |
          set -euo pipefail
          for migration in             database/0005_build3_run_registry.sql             database/0006_build3_evidence_snapshots.sql             database/0007_build3_data_quality.sql             database/0008_build3_forecast_horizons.sql             database/0009_build3_precision_decisions.sql
          do
            echo "applying $migration"
            psql -h 127.0.0.1 -U postgres -d edge_console_ci -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify Build 3.0 Foundation schema
        run: |
          set -euo pipefail
          TABLES="$(psql -h 127.0.0.1 -U postgres -d edge_console_ci -Atc "
            select string_agg(tablename, ',' order by tablename)
              from pg_tables
             where schemaname='public'
               and tablename in (
                 'build3_run_registry',
                 'build3_evidence_snapshots',
                 'build3_data_quality_assessments',
                 'build3_forecast_horizons',
                 'build3_precision_issuance',
                 'build3_precision_outcomes',
                 'build3_decisions'
               );
          ")"
          test "$TABLES" = "build3_data_quality_assessments,build3_decisions,build3_evidence_snapshots,build3_forecast_horizons,build3_precision_issuance,build3_precision_outcomes,build3_run_registry"
          psql -h 127.0.0.1 -U postgres -d edge_console_ci -v ON_ERROR_STOP=1 -c "
            select
              (select count(*) from build3_run_registry) as registry_rows,
              (select count(*) from build3_evidence_snapshots) as evidence_rows,
              (select count(*) from build3_data_quality_assessments) as quality_rows,
              (select count(*) from build3_forecast_horizons) as forecast_rows;
          "
