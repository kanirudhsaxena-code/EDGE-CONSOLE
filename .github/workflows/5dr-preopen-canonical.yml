name: EDGE NIFTY Pre-open Canonical Attempts

on:
  workflow_dispatch:
  schedule:
    - cron: '55 2 * * 1-5'
    - cron: '20,25 3 * * 1-5'

permissions:
  contents: read

concurrency:
  group: edge-nifty-preopen-canonical-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Launch and advance governed pre-open run
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          python - <<'PY'
          import json, os, time, subprocess
          from datetime import datetime
          from zoneinfo import ZoneInfo

          base=os.environ["CONSOLE_URL"].rstrip("/")
          def request_json(url,method="GET",payload=None):
              args=[
                  "curl","--location","--silent","--show-error","--fail-with-body",
                  "-H","Content-Type: application/json",
                  "-H","Accept: application/json",
                  "-H",f"CF-Access-Client-Id: {os.environ['CF_ACCESS_CLIENT_ID']}",
                  "-H",f"CF-Access-Client-Secret: {os.environ['CF_ACCESS_CLIENT_SECRET']}",
                  "-X",method,
              ]
              if payload is not None:
                  args += ["--data-binary",json.dumps(payload,separators=(",",":"))]
              args.append(url)
              proc=subprocess.run(args,text=True,capture_output=True)
              if proc.returncode!=0:
                  raise RuntimeError((proc.stderr or proc.stdout or "curl transport failed").strip())
              return json.loads(proc.stdout)
          IST=ZoneInfo("Asia/Kolkata")
          now=datetime.now(IST)
          warmup=now.replace(hour=8,minute=40,second=0,microsecond=0)
          cutoff=now.replace(hour=8,minute=55,second=59,microsecond=999999)
          if now < warmup:
              sleep_seconds=(warmup-now).total_seconds()
              print(f"prewarm_wait_seconds={int(sleep_seconds)}")
              time.sleep(sleep_seconds)
              now=datetime.now(IST)
          if now > cutoff:
              print(f"PREOPEN_SLOT_SKIPPED_OUTSIDE_WINDOW actual={now.isoformat()}")
              raise SystemExit(0)
          slot=now.strftime("%H:%M")
          body={
              "force_new":True,
              "canonical_attempt":True,
              "canonical_attempt_slot":slot,
              "client_invocation_id":f"preopen-{now:%Y%m%d-%H%M}",
          }
          payload=request_json(base+"/api/5dr/automated-runs","POST",body)
          request_id=((payload.get("request") or {}).get("request_id"))
          if not request_id:
              raise SystemExit(f"PREOPEN_RUN_CREATE_FAILED {payload}")
          print(f"request_id={request_id} slot={slot}")

          for attempt in range(48):
              time.sleep(8)
              try:
                  state=request_json(base+f"/api/5dr/run-requests/{request_id}/resume-processing","POST",{})
              except Exception as exc:
                  print(f"resume_attempt={attempt+1} transport_error={type(exc).__name__}:{str(exc)[:160]}")
                  continue
              status=str(state.get("status") or "")
              stage=str(state.get("adapter_stage") or "")
              print(f"resume_attempt={attempt+1} status={status} stage={stage}")
              if status=="COMPLETED":
                  print(json.dumps({
                      "status":"PREOPEN_RUN_COMPLETED",
                      "request_id":request_id,
                      "run_id":state.get("run_id"),
                      "slot":slot,
                      "completed_at":datetime.now(ZoneInfo("Asia/Kolkata")).isoformat(),
                  },sort_keys=True))
                  raise SystemExit(0)
              if status=="FAILED":
                  raise SystemExit(f"PREOPEN_RUN_FAILED request_id={request_id} stage={stage}")
          raise SystemExit(f"PREOPEN_RUN_TIMEOUT request_id={request_id}")
          PY
