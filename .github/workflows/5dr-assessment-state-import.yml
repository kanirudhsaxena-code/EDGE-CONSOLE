name: Import 5DR Canonical Assessment State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/5dr-assessment-state-import.yml'
  schedule:
    - cron: '25 3-11 * * 1-5'

permissions:
  contents: read

concurrency:
  group: import-5dr-canonical-assessment
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONSOLE_URL: https://edge-console.k-anirudhsaxena.workers.dev
      HANDOFF_URL: https://raw.githubusercontent.com/kanirudhsaxena-code/5DR-V2/state/assessment-handoff/runtime/5dr-assessment-handoff.json
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Fetch and validate canonical assessment state
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H 'Accept: application/json' \
            -H 'Cache-Control: no-cache' \
            "$HANDOFF_URL" -o /tmp/5dr-assessment-handoff.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          handoff=json.load(open('/tmp/5dr-assessment-handoff.json',encoding='utf-8'))
          if handoff.get("schema_version")!="5DR_ASSESSMENT_HANDOFF_V1":
              raise SystemExit(f"ASSESSMENT_HANDOFF_SCHEMA_MISMATCH {handoff.get('schema_version')}")
          generated=handoff.get("generated_at")
          if not isinstance(generated,str):
              raise SystemExit("ASSESSMENT_HANDOFF_MISSING_GENERATED_AT")
          generated_at=datetime.fromisoformat(generated.replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-generated_at.astimezone(timezone.utc)).total_seconds()
          if age < -300 or age > 7200:
              raise SystemExit(f"ASSESSMENT_HANDOFF_STALE age_seconds={int(age)}")
          assessment=handoff.get("assessment")
          if not isinstance(assessment,dict) or assessment.get("engine")!="5DR":
              raise SystemExit("ASSESSMENT_HANDOFF_INVALID_PAYLOAD")
          with open('/tmp/5dr-assessment-import.json','w',encoding='utf-8') as out:
              json.dump(assessment,out,separators=(',',':'))
          print("assessment_handoff_valid")
          PY
      - name: Import canonical assessment through governed 5DR route
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          last_code=""
          for attempt in $(seq 1 12); do
            code="$(curl --location --silent --show-error \
              -o /tmp/assessment-import-response.json -w '%{http_code}' \
              -X POST \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H 'Cache-Control: no-cache' \
              --data-binary @/tmp/5dr-assessment-import.json \
              "$CONSOLE_URL/api/5dr/assessment-import")"
            echo "assessment_import_status=$code attempt=$attempt"
            cat /tmp/assessment-import-response.json || true
            echo
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              exit 0
            fi
            last_code="$code"
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "ASSESSMENT_IMPORT_FAILED_AFTER_RETRIES http=$last_code"
          exit 1
