name: EDGE Console Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Deploy tagged Cloudflare Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TAG="git-${GITHUB_SHA:0:12}"
          echo "DEPLOY_TAG=$TAG" >> "$GITHUB_ENV"
          npx wrangler deploy \
            --tag "$TAG" \
            --message "EDGE-CONSOLE git=$GITHUB_SHA workflow=$GITHUB_RUN_ID" \
            | tee /tmp/wrangler-deploy.txt
          VERSION_ID="$(sed -nE 's/.*Current Version ID: ([0-9a-fA-F-]{36}).*/\1/p' /tmp/wrangler-deploy.txt | tail -1)"
          if ! printf '%s' "$VERSION_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo 'Wrangler did not emit a valid Current Version ID'
            cat /tmp/wrangler-deploy.txt
            exit 1
          fi
          echo "DEPLOY_VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
          echo "deployed_version=$VERSION_ID tag=$TAG"
      - name: Verify tagged version is the active deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler versions list --json > /tmp/versions.json
          npx wrangler deployments list --json > /tmp/deployments.json
          node <<'NODE'
          const fs=require('fs');
          const tag=process.env.DEPLOY_TAG;
          const versionId=process.env.DEPLOY_VERSION_ID;
          const versions=JSON.parse(fs.readFileSync('/tmp/versions.json','utf8'));
          const deployments=JSON.parse(fs.readFileSync('/tmp/deployments.json','utf8'));
          let match=null;
          const walk=(node)=>{
            if(match||node===null||typeof node!=='object')return;
            if(!Array.isArray(node)){
              const ids=[node.id,node.version_id,node.versionId].filter(v=>typeof v==='string');
              if(ids.includes(versionId)){match=node;return;}
            }
            for(const value of Object.values(node))walk(value);
          };
          walk(versions);
          if(!match)throw new Error(`Deployed version ${versionId} was not returned by Wrangler versions list`);
          if(!JSON.stringify(match).includes(tag))throw new Error(`Version ${versionId} does not carry governed tag ${tag}`);
          if(!JSON.stringify(deployments).includes(versionId))throw new Error(`Version ${versionId} is not present in current deployment history`);
          console.log(`verified_active_version=${versionId} tag=${tag}`);
          NODE
      - name: Reconcile additive Build 3 production schema
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          BASE='https://edge-console.k-anirudhsaxena.workers.dev'
          AUTH=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          code="$(curl --location --silent --show-error "${AUTH[@]}" -H 'Cache-Control: no-cache' "$BASE/api/build3/preview-schema" -o /tmp/build3-schema-before.json -w '%{http_code}')"
          echo "build3_schema_status_http=$code"
          test "$code" = "200"
          if python - <<'PY'
          import json
          d=json.load(open('/tmp/build3-schema-before.json'))
          raise SystemExit(0 if d.get('ready') is True else 1)
          PY
          then
            cp /tmp/build3-schema-before.json /tmp/build3-schema-after.json
          else
            code="$(curl --location --silent --show-error "${AUTH[@]}" -H 'Cache-Control: no-cache' -H 'X-Build3-Schema-Action: APPLY_ADDITIVE_BUILD3_V1' -X POST "$BASE/api/build3/preview-schema" -o /tmp/build3-schema-apply.json -w '%{http_code}')"
            echo "build3_schema_apply_http=$code"
            cat /tmp/build3-schema-apply.json
            echo
            test "$code" = "200"
            curl --location --fail --silent --show-error "${AUTH[@]}" -H 'Cache-Control: no-cache' "$BASE/api/build3/preview-schema" -o /tmp/build3-schema-after.json
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/build3-schema-after.json'))
          assert d.get('version')=='MDOS_BUILD_3_SCHEMA_V1', d
          assert d.get('ready') is True, d
          assert not d.get('missing_tables'), d
          assert not d.get('missing_columns'), d
          print('BUILD3_PRODUCTION_SCHEMA_READY=PASS')
          PY
      - name: Verify production health after tagged deploy
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          BASE='https://edge-console.k-anirudhsaxena.workers.dev'
          for i in $(seq 1 12); do
            if curl --location --fail --silent --show-error \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H 'Cache-Control: no-cache' \
              "$BASE/api/edge-stocks/health?deploy=${DEPLOY_TAG}" -o /tmp/deploy-health.json; then
              if python - <<'PY'
          import json
          d=json.load(open('/tmp/deploy-health.json'))
          assert d.get('ok') is True, d
          assert d.get('edge_database_configured') is True, d
          assert d.get('research_contract_version') == 'EDGE_RESEARCH_BUNDLE_V2', d
          assert d.get('research_authority') == 'EDGE_SYSTEM', d
          assert d.get('fresh_data_required') is True, d
          assert d.get('fresh_web_research_required') is True, d
          assert d.get('data_first_lifecycle') is True, d
          assert d.get('chat_scheduled_task_dependency') is False, d
          PY
              then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Tagged deployment did not pass production health verification"
          cat /tmp/deploy-health.json || true
          exit 1
      - name: Verify governed 5DR ingestion route is deployed
        run: |
          set -euo pipefail
          BASE='https://edge-console.k-anirudhsaxena.workers.dev'
          # Deliberately invalid payload: the governed route may reject it, but it must exist.
          # A 404 proves the deployed Worker cannot accept immutable 5DR run handoffs.
          STATUS="$(curl --location --silent --show-error \
            -o /tmp/5dr-route-probe.json -w '%{http_code}' \
            -X POST \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'Cache-Control: no-cache' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "$BASE/api/5dr/runs")"
          echo "5dr_ingestion_probe_status=$STATUS"
          if [ "$STATUS" = '404' ]; then
            echo 'Governed POST /api/5dr/runs route is absent from the active production deployment.'
            cat /tmp/5dr-route-probe.json || true
            exit 1
          fi
          if [ "$STATUS" -ge 500 ]; then
            echo 'Governed POST /api/5dr/runs route exists but failed its production route probe.'
            cat /tmp/5dr-route-probe.json || true
            exit 1
          fi
      - name: Note preserved runtime secrets
        run: echo "Existing Cloudflare Worker secrets are preserved across deploys; no secret rewrite is required."
